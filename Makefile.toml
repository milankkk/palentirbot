[tasks.check]
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--locked"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace", "--locked"]

[tasks.build]
command = "cargo"
args = ["build", "--locked"]

[tasks.build_release]
command = "cargo"
args = ["build", "--release", "--locked"]

[tasks.run]
command = "cargo"
args = ["run", "--locked"]

[tasks.run_release]
command = "cargo"
args = ["run", "--release", "--locked"]